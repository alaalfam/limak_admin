services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=128M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.5

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # No published host port — reached only via the frontend nginx
    # container over the shared frontend_default network (service name
    # "wordpress"), same pattern the frontend's own `web` service uses.
    expose:
      - "80"
    networks:
      - default
      - frontend_default
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX}
      # Unlike docker-compose.yml, debug output is off in production.
      WORDPRESS_DEBUG: 0
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - wp_core:/var/www/html
      # Swagger UI for the limak/v1 OpenAPI spec, served at
      # admin.limakstudio.ir/docs/. Apache serves these as plain static
      # files (WordPress's own rewrite rules only apply when the
      # requested path doesn't already exist on disk), so this needs no
      # nginx or WordPress changes at all — the existing catch-all
      # proxy_pass already reaches it.
      - ./docs:/var/www/html/docs:ro
    mem_limit: 512m
    cpus: 0.75

  wpcli:
    image: wordpress:cli
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WP_URL: ${WP_URL}
      WP_SITE_TITLE: ${WP_SITE_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - wp_core:/var/www/html
      - ./scripts:/scripts
    entrypoint: ["sh", "/scripts/bootstrap.sh"]
    restart: "no"

  # Bound to loopback only — never reachable from outside the VPS.
  # Use it via an SSH tunnel: ssh -L 8081:localhost:8081 deploy@185.10.75.150
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PMA_PORT}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    mem_limit: 128m
    cpus: 0.25

volumes:
  db_data:
  wp_core:

networks:
  default: {}
  frontend_default:
    external: true
